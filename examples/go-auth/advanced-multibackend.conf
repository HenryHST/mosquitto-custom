# Example: files + ldap (+ optional redis as extra backend via go_auth.extra_backends)
# Use with standalone image: mount as /mosquitto/config/mosquitto.conf
# Plugin built from third_party/mosquitto-go-auth

persistence true
persistence_location /mosquitto/data/
log_dest stdout
allow_anonymous false

listener 1883
protocol mqtt

auth_plugin /mosquitto/go-auth.so
auth_opt_backends files,ldap
auth_opt_hasher pbkdf2
auth_opt_cache true
auth_opt_cache_type go-cache
auth_opt_log_level info
auth_opt_log_dest stdout
auth_opt_exhaust_backend_first true

auth_opt_files_password_path /mosquitto/config/passwords
auth_opt_files_acl_path /mosquitto/config/acls

auth_opt_ldap_url ldap://ldap.example.com:389
auth_opt_ldap_user_dn ou=users,dc=example,dc=com
auth_opt_ldap_group_dn ou=groups,dc=example,dc=com
auth_opt_ldap_bind_dn cn=serviceaccount,ou=users,dc=example,dc=com
auth_opt_ldap_bind_password CHANGE_ME
auth_opt_ldap_user_filter (&(cn=%s)(|(memberOf=cn=mqtt_users,ou=groups,dc=example,dc=com)(memberOf=cn=mqtt_admins,ou=groups,dc=example,dc=com)))
auth_opt_ldap_superuser_filter (&(cn=%s)(memberOf=cn=mqtt_admins,ou=groups,dc=example,dc=com))
auth_opt_ldap_group_filter (member=%s)
# Optional LDAP ACL attributes (require group_dn):
# auth_opt_ldap_acl_topic_pattern_attribute mqtt_topic_pattern
# auth_opt_ldap_acl_acc_attribute mqtt_topic_acc
