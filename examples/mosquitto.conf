# Example mosquitto.conf for LDAP authentication
# This is a reference configuration for use with the mosquitto-custom image

# =============================================================================
# Persistence
# =============================================================================
persistence true
persistence_location /mosquitto/data/

# =============================================================================
# Logging
# =============================================================================
log_dest stdout
log_type error
log_type warning
log_type notice

# =============================================================================
# Security
# =============================================================================
allow_anonymous false
per_listener_settings false

# Publish $SYS/# topics for monitoring
sys_interval 10

# =============================================================================
# Listeners
# =============================================================================

# Standard MQTT (unencrypted)
listener 1883
protocol mqtt

# MQTT over TLS
listener 8883
protocol mqtt
certfile /mosquitto/certs/tls.crt
keyfile /mosquitto/certs/tls.key
require_certificate false

# WebSockets over TLS
listener 9001
protocol websockets
certfile /mosquitto/certs/tls.crt
keyfile /mosquitto/certs/tls.key
require_certificate false

# =============================================================================
# Authentication Plugin (mosquitto-go-auth)
# =============================================================================
auth_plugin /mosquitto/go-auth.so
auth_opt_backends ldap
auth_opt_log_level info
auth_opt_log_dest stdout

# =============================================================================
# LDAP Configuration
# =============================================================================

# LDAP Server URL (use ldaps:// for TLS)
auth_opt_ldap_url ldap://ldap.example.com:389

# Base DNs
auth_opt_ldap_user_dn ou=users,dc=example,dc=com
auth_opt_ldap_group_dn ou=groups,dc=example,dc=com

# Service account for LDAP binding
auth_opt_ldap_bind_dn cn=serviceaccount,ou=users,dc=example,dc=com
auth_opt_ldap_bind_password CHANGE_ME

# User authentication filter
# %s is replaced with the username attempting to authenticate
auth_opt_ldap_user_filter (&(cn=%s)(|(memberOf=cn=mqtt_users,ou=groups,dc=example,dc=com)(memberOf=cn=mqtt_admins,ou=groups,dc=example,dc=com)))

# Superuser filter (admin privileges)
auth_opt_ldap_superuser_filter (&(cn=%s)(memberOf=cn=mqtt_admins,ou=groups,dc=example,dc=com))

# =============================================================================
# LDAP ACL attributes (optional)
# =============================================================================
# Without ACL attributes, authenticated users may pub/sub any topic.
# When set, ldap_group_dn is required and group entries supply topic patterns.
auth_opt_ldap_group_filter (member=%s)
# auth_opt_ldap_acl_topic_pattern_attribute mqtt_topic_pattern
# auth_opt_ldap_acl_acc_attribute mqtt_topic_acc

# =============================================================================
# Notes for Production Use
# =============================================================================
# 1. Use ldaps:// for encrypted LDAP connections
# 2. Store bind password securely (Kubernetes Secret, env var, etc.)
# 3. Configure ACL to restrict topic access
# 4. Use strong TLS certificates from a trusted CA
# 5. Consider enabling require_certificate for mutual TLS
# 6. Monitor $SYS/# topics for broker health
