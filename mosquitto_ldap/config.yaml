---
version: "1.0.0"
slug: mosquitto_ldap
name: Mosquitto broker (LDAP)
description: MQTT broker with Home Assistant users and optional LDAP via mosquitto-go-auth
url: https://github.com/HenryHST/mosquitto-custom/tree/main/mosquitto_ldap
arch:
  - aarch64
  - amd64
auth_api: true
discovery:
  - mqtt
image: ghcr.io/henryhst/{arch}-addon-mosquitto-ldap
map:
  - ssl
  - share
options:
  logins: []
  log_dest: []
  log_type: []
  require_certificate: false
  certfile: fullchain.pem
  keyfile: privkey.pem
  customize:
    active: false
    folder: mosquitto
  ldap:
    enabled: false
    url: "ldap://ldap.example.com:389"
    user_dn: "ou=users,dc=example,dc=com"
    group_dn: "ou=groups,dc=example,dc=com"
    bind_dn: ""
    bind_password: ""
    user_filter: "(&(cn=%s)(memberOf=cn=mqtt_users,ou=groups,dc=example,dc=com))"
    superuser_filter: "(&(cn=%s)(memberOf=cn=mqtt_admins,ou=groups,dc=example,dc=com))"
ports:
  1883/tcp: 1883
  1884/tcp: 1884
  8883/tcp: 8883
  8884/tcp: 8884
schema:
  logins:
    - username: str
      password: password
      password_pre_hashed: "bool?"
  log_dest:
    - list(none|stdout|stderr|topic)?
  log_type:
    - list(none|debug|error|warning|notice|information|subscribe|unsubscribe|websockets|all)?
  require_certificate: bool
  certfile: str
  cafile: str?
  keyfile: str
  customize:
    active: bool
    folder: str
  debug: bool?
  ldap:
    enabled: bool
    url: str
    user_dn: str
    group_dn: str
    bind_dn: str
    bind_password: password
    user_filter: str
    superuser_filter: str
services:
  - mqtt:provide
startup: system
watchdog: tcp://[HOST]:1883
init: false
